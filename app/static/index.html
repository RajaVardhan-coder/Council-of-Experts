<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Council-of-Experts</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      height: 80px;
      font-size: 14px;
      padding: 8px;
    }

    button {
      margin-top: 10px;
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
    }

    .experts {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .expert {
      flex: 1;
      background: white;
      border-radius: 6px;
      padding: 10px;
      box-shadow: 0 0 4px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
    }

    .expert h3 {
      margin: 0 0 6px 0;
      font-size: 14px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 4px;
    }

    .expert pre {
      flex: 1;
      white-space: pre-wrap;
      font-size: 13px;
      overflow-y: auto;
    }

    .done {
      color: green;
      font-weight: bold;
      font-size: 12px;
      margin-top: 6px;
    }
  </style>
</head>
<body>

<h1> 🧠 Council of Experts: A Multi-Agent Advisory System</h1>

<textarea id="problem" placeholder="Enter a problem to ask the experts..."></textarea>
<br />
<button onclick="start()">Run Experts</button>

<div class="experts" id="experts"></div>

<script>
async function start() {
  const problem = document.getElementById("problem").value.trim();
  if (!problem) return;

  document.getElementById("experts").innerHTML = "";

  const response = await fetch("http://localhost:8000/advice", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ problem })
  });

  const reader = response.body.getReader();
  const decoder = new TextDecoder();

  let buffer = "";
  const expertEls = {};

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;

    buffer += decoder.decode(value, { stream: true });

    let lines = buffer.split("\n");
    buffer = lines.pop(); // keep incomplete line

    for (const line of lines) {
      if (!line.trim()) continue;

      const event = JSON.parse(line);

      const name = event.expert || "system";

      if (!expertEls[name]) {
        const container = document.createElement("div");
        container.className = "expert";

        const title = document.createElement("h3");
        title.textContent = name;

        const content = document.createElement("pre");

        container.appendChild(title);
        container.appendChild(content);
        document.getElementById("experts").appendChild(container);

        expertEls[name] = { content, container };
      }

      if (event.type === "delta") {
        expertEls[name].content.textContent += event.content;
      }

      if (event.type === "done") {
        const doneLabel = document.createElement("div");
        doneLabel.className = "done";
        doneLabel.textContent = "✔ Done";
        expertEls[name].container.appendChild(doneLabel);
      }

      if (event.type === "error") {
        expertEls[name].content.textContent +=
          "\n[ERROR] " + event.message;
      }
    }
  }
}
</script>

</body>
</html>
